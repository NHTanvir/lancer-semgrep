[workspace]
resolver = "2"
members = [
    "crates/lancer-semgrep",
    "crates/semgrep-core",
    "crates/tree-sitter-langs",
    "crates/semgrep-rules",
    "crates/semgrep-taint",
    "crates/semgrep-output",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["NHTanvir <naymulhasantanvir10@gmail.com>"]
license = "MIT"
repository = "https://github.com/NHTanvir/lancer-semgrep"
description = "Rust clone of semgrep — part of the Lancer bug bounty toolkit"

[workspace.dependencies]
# CLI / async
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }

# Errors
anyhow = "1"
eyre = "0.6"
thiserror = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
serde_sarif = "0.4"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Pattern matching / parsing
regex = "1.11"
memchr = "2.7"
tree-sitter = "0.22"

# Filesystem traversal
walkdir = "2.5"
ignore = "0.4"
globset = "0.4"

# Graphs / parallelism
petgraph = "0.6"
rayon = "1.11"

# Storage / hashing
redb = "2"
sha2 = "0.10"
blake3 = "1.5"

# VCS
git2 = "0.19"

# Output rendering
owo-colors = "4"
similar = "2.6"
tinytemplate = "1.2"
junit-report = "0.8"

# HTTP / TLS
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rustls = "0.23"

# Misc utilities
directories = "5"
dashmap = "6"
crossbeam-channel = "0.5"
once_cell = "1"
bytes = "1"
duct = "0.13"
jsonschema = "0.18"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
